<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Derja Ai</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000000;
      --surface: #1f1f1f;
      --bubble: #2f2f2f;
      --text: #ffffff;
      --muted: #8e8e93;
      --blue: #1a7fd4;
      --blue-active: #1567ad;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    .app { position: relative; height: 100vh; display: flex; flex-direction: column; }

    @media (min-width: 900px) {
      .chat { max-width: 960px; margin: 0 auto; padding: 84px 32px 120px; }
      .topbar { max-width: 960px; margin: 0 auto; left: 0; right: 0; padding: 0 32px; }
      .inputbar { max-width: 960px; margin: 0 auto; left: 0; right: 0; bottom: 24px; }
      .msg-user, .msg-assistant { max-width: 70%; font-size: 17px; }
      .msg-user { border-radius: 28px; padding: 14px 20px; min-width: 240px; }
      .brand { font-size: 20px; }
      .logo { width: 36px; height: 36px; }
    }

    /* Top bar */
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      z-index: 20;
    }
    .topbar .group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pill-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bubble);
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--text);
      cursor: pointer;
    }
    .icon-btn {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bubble);
      border: none;
      border-radius: 50%;
      color: var(--text);
      cursor: pointer;
    }
    .logo {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 18px; font-weight: 600;
    }

    /* Chat area */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 76px 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-user, .msg-assistant {
      max-width: 85%;
      font-size: 16px;
      line-height: 1.45;
    }
    .msg-user {
      align-self: flex-start;
      background: var(--bubble);
      border-radius: 24px;
      padding: 12px 18px;
      color: var(--text);
      min-width: 220px;
      width: fit-content;
    }
    .msg-assistant {
      align-self: flex-end;
      color: var(--text);
      text-align: right;
    }
    .msg-assistant .text {
      direction: rtl;
      white-space: pre-wrap;
    }
    .assistant-row {
      display: flex; align-items: flex-end; gap: 8px;
    }
    .assistant-row.reverse {
      flex-direction: row-reverse;
    }
    .assistant-avatar {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #222;
    }
    .copy-btn {
      margin-top: 6px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 4px;
    }
    .copy-btn svg { width: 18px; height: 18px; }

    /* Typing dots */
    .typing {
      display: inline-flex; gap: 4px; padding: 6px 0;
    }
    .typing span {
      width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(1) { animation-delay: 0s; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* Input area */
    .inputbar {
      position: absolute;
      bottom: 16px;
      left: 16px; right: 16px;
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #333;
      z-index: 20;
    }
    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      color: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }
    .send-btn:active { background: var(--blue-active); }
    .send-btn svg { width: 18px; height: 18px; }
    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      padding: 8px 0;
      text-align: right;
    }
    .chat-input::placeholder { color: var(--muted); }
    .chat-input:disabled { opacity: .7; }
    .attach-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Sidebar */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 30;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .sidebar {
      position: fixed;
      top: 0; right: 0;
      width: 260px; height: 100%;
      background: #111;
      padding: 20px;
      transform: translateX(100%);
      transition: transform .25s ease;
      z-index: 31;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar h3 { margin-bottom: 16px; font-size: 16px; color: var(--muted); }
    .sidebar-item {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: var(--surface);
      font-size: 14px;
      cursor: pointer;
    }
    .sidebar-item:hover { background: var(--bubble); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%; transform: translateX(-50%);
      background: var(--bubble);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 40;
    }
    .toast.show { opacity: 1; }

    /* Scrollbar */
    .chat::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="group">
        <button class="pill-btn" id="menuBtn" title="محادثة جديدة">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <div class="group">
        <div class="brand">
          <span>Derja Ai</span>
          <img src="/static/logo.png" class="logo" alt="Derja Ai" />
        </div>
      </div>
      <div class="group">
        <button class="icon-btn" id="historyBtn" title="المحادثات السابقة">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="msg-assistant">
        <div class="assistant-row reverse">
          <img src="/static/logo.png" class="assistant-avatar" alt="Derja Ai" />
          <div>
            <div class="text">مرحبًا! 👋 أنا Derja Ai. كيف يمكنني مساعدتك اليوم؟</div>
            <button class="copy-btn" title="نسخ" data-text="مرحبًا! 👋 أنا Derja Ai. كيف يمكنني مساعدتك اليوم؟">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <form class="inputbar" id="inputForm">
      <button type="submit" class="send-btn" id="sendBtn" title="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      <input type="text" class="chat-input" id="chatInput" placeholder="الرسالة إلى Derja Ai" autocomplete="off" />
      <button type="button" class="attach-btn" id="attachBtn" title="إرفاق">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </form>

    <div class="overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar">
      <h3>المحادثات السابقة</h3>
      <div class="sidebar-item">محادثة جديدة</div>
      <div class="sidebar-item">اليوم</div>
      <div class="sidebar-item">الأمس</div>
      <div class="sidebar-item">الأسبوع الماضي</div>
    </div>

    <div class="toast" id="toast">تم النسخ</div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const inputForm = document.getElementById('inputForm');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const menuBtn = document.getElementById('menuBtn');
    const historyBtn = document.getElementById('historyBtn');
    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');
    const toast = document.getElementById('toast');

    let messages = [{role:'assistant', content:'مرحبًا! 👋 أنا Derja Ai. كيف يمكنني مساعدتك اليوم؟'}];

    function apiConfig() {
      const url = new URL(window.location.href);
      const base = `${url.protocol}//${url.host}`;
      const headers = {};
      if (url.username || url.password) {
        const creds = `${url.username || ''}:${url.password || ''}`;
        headers['Authorization'] = 'Basic ' + btoa(creds);
      }
      return { base, headers };
    }

    function addUser(text) {
      const div = document.createElement('div');
      div.className = 'msg-user';
      div.textContent = text;
      chat.appendChild(div);
      scrollBottom();
    }

    function addAssistant(text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-assistant';

      const row = document.createElement('div');
      row.className = 'assistant-row reverse';

      const avatar = document.createElement('img');
      avatar.src = '/static/logo.png';
      avatar.className = 'assistant-avatar';
      avatar.alt = 'Derja Ai';

      const content = document.createElement('div');

      const textDiv = document.createElement('div');
      textDiv.className = 'text';
      textDiv.textContent = text;

      const copy = document.createElement('button');
      copy.className = 'copy-btn';
      copy.title = 'نسخ';
      copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      copy.onclick = () => doCopy(text);

      content.appendChild(textDiv);
      content.appendChild(copy);
      row.appendChild(avatar);
      row.appendChild(content);
      wrapper.appendChild(row);
      chat.appendChild(wrapper);
      scrollBottom();
    }

    function showTyping() {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-assistant';
      wrapper.id = 'typingIndicator';
      const row = document.createElement('div');
      row.className = 'assistant-row reverse';
      const avatar = document.createElement('img');
      avatar.src = '/static/logo.png';
      avatar.className = 'assistant-avatar';
      avatar.alt = 'Derja Ai';
      const content = document.createElement('div');
      content.className = 'typing';
      content.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(avatar);
      row.appendChild(content);
      wrapper.appendChild(row);
      chat.appendChild(wrapper);
      scrollBottom();
      return wrapper;
    }

    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function scrollBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function doCopy(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('تم النسخ');
      } catch (e) {
        showToast('فشل النسخ');
      }
    }

    function setLoading(loading) {
      chatInput.disabled = loading;
      sendBtn.disabled = loading;
    }

    async function sendMessage(text) {
      messages.push({role:'user', content: text});
      try {
        const cfg = apiConfig();
        const res = await fetch(`${cfg.base}/api/chat`, {
          method: 'POST',
          headers: {...cfg.headers, 'Content-Type':'application/json'},
          body: JSON.stringify({messages})
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) {
          throw new Error(data.detail || data.error || 'فشل الاتصال بالـ API');
        }
        const reply = data.choices?.[0]?.message?.content || data.content?.[0]?.text || 'لم أفهم تمامًا، هل يمكنك التوضيح؟';
        messages.push({role:'assistant', content: reply});
        addAssistant(reply);
      } catch (err) {
        addAssistant('خطأ: ' + err.message);
      }
    }

    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      addUser(text);
      chatInput.value = '';
      setLoading(true);
      showTyping();
      await sendMessage(text);
      removeTyping();
      setLoading(false);
    });

    attachBtn.addEventListener('click', () => {
      showToast('سيتم دعم رفع الملفات لاحقًا');
    });

    function toggleSidebar(show) {
      sidebar.classList.toggle('open', show);
      overlay.classList.toggle('open', show);
    }

    historyBtn.addEventListener('click', () => toggleSidebar(true));
    overlay.addEventListener('click', () => toggleSidebar(false));

    menuBtn.addEventListener('click', () => {
      chat.innerHTML = '';
      messages = [];
      addAssistant('مرحبًا! 👋 أنا Derja Ai. كيف يمكنني مساعدتك اليوم؟');
      messages.push({role:'assistant', content:'مرحبًا! 👋 أنا Derja Ai. كيف يمكنني مساعدتك اليوم؟'});
      showToast('محادثة جديدة');
    });

    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => doCopy(btn.dataset.text));
    });
  </script>
</body>
</html>
