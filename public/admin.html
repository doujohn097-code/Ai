<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Derja Ai - Admin</title>
<style>
  :root {
    --bg: #050507;
    --card: #0f1014;
    --card-hover: #16181d;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --blue: #2563eb;
    --blue-active: #1d4ed8;
    --border: #2a2c35;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .app { max-width: 1200px; margin: 0 auto; padding: 0 16px 40px; }
  .topbar {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(5,5,7,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10;
  }
  .logo { width: 32px; height: 32px; border-radius: 50%; }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .login {
    display: flex;
    gap: 10px;
    max-width: 520px;
    margin: 30px auto;
  }
  .login input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 999px;
    outline: none;
    font-size: 15px;
    transition: border-color .2s;
  }
  .login input:focus { border-color: var(--blue); }
  .login button, .card .actions a, .card .actions button {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: background .2s;
  }
  .login button:hover { background: var(--blue-active); }
  .stats {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .login { flex-direction: column; }
    .login button { width: 100%; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: background .2s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .card .title {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card .id {
    font-weight: 700;
    color: #fff;
    font-size: 15px;
    word-break: break-all;
    line-height: 1.4;
  }
  .card .badge {
    background: rgba(37,99,235,0.15);
    color: var(--blue);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card .meta {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  .card .meta span { display: block; }
  .card .actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  .card .actions a, .card .actions button {
    flex: 1;
    text-align: center;
    text-decoration: none;
    background: #1f2937;
    color: var(--text);
    border: none;
    padding: 10px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: background .2s;
    font-weight: 600;
  }
  .card .actions a:hover, .card .actions button:hover { background: #2f2f2f; }
  .card .actions a.open { background: var(--blue); color: #fff; }
  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 60px;
    font-size: 16px;
  }
  .error {
    background: rgba(239,68,68,0.12);
    color: #f87171;
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    max-width: 520px;
    margin: 20px auto;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 50;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .modal-header span { font-weight: 600; font-size: 16px; }
  .modal-header button {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 26px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    transition: background .2s;
  }
  .modal-header button:hover { background: rgba(255,255,255,0.1); }
  .modal iframe { flex: 1; border: none; border-radius: 16px; background: #000; width: 100%; }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img src="/static/logo.png" class="logo" alt="Derja Ai">
      <h1>Derja Ai Admin</h1>
    </header>

    <main>
      <div class="login">
        <input id="keyInput" type="password" placeholder="Admin key">
        <button id="loadBtn">تحميل</button>
      </div>
      <div id="stats" class="stats" style="display:none;"></div>
      <div id="list"></div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-header">
      <span>معاينة المحادثة</span>
      <button id="closeBtn">×</button>
    </div>
    <iframe id="frame" sandbox="allow-same-origin allow-scripts"></iframe>
  </div>

<script>
const keyInput = document.getElementById('keyInput');
const loadBtn = document.getElementById('loadBtn');
const list = document.getElementById('list');
const stats = document.getElementById('stats');
const modal = document.getElementById('modal');
const frame = document.getElementById('frame');
const closeBtn = document.getElementById('closeBtn');

const params = new URLSearchParams(location.search);
const initialKey = params.get('key');
if (initialKey) keyInput.value = initialKey;

async function load() {
  const key = keyInput.value.trim();
  if (!key) { showError('أدخل مفتاح الأدمن'); return; }
  list.innerHTML = '';
  stats.style.display = 'none';
  try {
    const res = await fetch('/api/admin/conversations?admin_key=' + encodeURIComponent(key));
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'خطأ في تحميل المحادثات'); return; }
    render(data.conversations || [], key);
  } catch (e) { showError('فشل الاتصال: ' + e.message); }
}

function render(items, key) {
  if (!items.length) {
    list.innerHTML = '<div class="empty">ماكش محادثات محفوظة حالياً</div>';
    stats.style.display = 'none';
    return;
  }
  stats.textContent = `عدد المحادثات: ${items.length}`;
  stats.style.display = 'block';
  list.innerHTML = '';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const date = item.last_modified ? new Date(item.last_modified).toLocaleString('ar-DZ') : '';
    const sizeText = (item.size || 0).toLocaleString('ar-DZ');
    const user = item.user_id || 'unknown';
    card.innerHTML = `
      <div class="title">
        <div class="id">${escapeHtml(item.conversation_id || 'محادثة')}</div>
        <div class="badge">${escapeHtml(user)}</div>
      </div>
      <div class="meta">
        <span>🕓 ${date}</span>
        <span>📦 ${sizeText} بايت</span>
      </div>
      <div class="actions">
        <a class="open" href="${item.url}" target="_blank">فتح</a>
        <button class="view">معاينة</button>
      </div>`;
    card.querySelector('.view').onclick = () => openPreview(item.key, key);
    list.appendChild(card);
  });
}

function openPreview(key, adminKey) {
  frame.src = '/api/admin/view?key=' + encodeURIComponent(key) + '&admin_key=' + encodeURIComponent(adminKey);
  modal.style.display = 'flex';
}

function closePreview() {
  modal.style.display = 'none';
  frame.src = '';
}

function showError(msg) {
  list.innerHTML = '<div class="error">' + escapeHtml(msg) + '</div>';
  stats.style.display = 'none';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadBtn.onclick = load;
closeBtn.onclick = closePreview;
modal.onclick = (e) => { if (e.target === modal) closePreview(); };
if (initialKey) load();
</script>
</body>
</html>
